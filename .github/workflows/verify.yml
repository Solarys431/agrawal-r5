name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean:
    name: Lean kernel and certificates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the pinned Lean project
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1
        with:
          build: true
          build-args: "--wfail"
          use-mathlib-cache: true

      - name: Print axioms of headline declarations
        run: lake env lean AxiomAudit.lean

      - name: Audit public instance assumptions
        run: lake env lean AssumptionAudit.lean

      - name: Verify the complete upstream-candidate inventory
        run: python3 tools/check_upstream_inventory.py

      - name: Audit the public theorem surface
        run: tools/check_release_surface.sh

      - name: Compile independent challenges and submitted solutions
        run: |
          lake build Comparator.GoldenMoment.Challenge Comparator.GoldenMoment.Solution
          lake build Comparator.FermatShadow.Challenge Comparator.FermatShadow.Solution
          lake build Comparator.PrimitiveSupport.Challenge Comparator.PrimitiveSupport.Solution
          lake build Comparator.FinalRowSize.Challenge Comparator.FinalRowSize.Solution
          lake env lean ComparatorAxiomAudit.lean

      - name: Install certificate dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes pari-gp
          python3 -m pip install --requirement requirements.txt

      - name: Verify tracked release checksums
        run: sha256sum --check SHA256SUMS.txt

      - name: Replay shipped certificates
        run: python3 tools/verify_certificates.py

      - name: Replay the independent golden-bridge audit
        run: |
          (cd certificates/golden_bridge &&
            sha256sum --check SHA256_PONTE_AUREO.txt)
          python3 certificates/golden_bridge/verify_golden_bridge_end_to_end.py \
            --limit 10000 \
            --output /tmp/VERIFICA_PONTE_AUREO_10K.json
          cmp certificates/golden_bridge/VERIFICA_PONTE_AUREO_10K.json \
            /tmp/VERIFICA_PONTE_AUREO_10K.json

      - name: Independent scalar-completeness regression
        run: python3 tools/verify_scalar.py

      - name: Replay the H4 minimum-gcd near miss
        run: |
          python3 certificates/h4_levels/verify_H_near_miss.py \
            > /tmp/esito_H_near_miss_1368322369.json
          cmp certificates/h4_levels/esito_H_near_miss_1368322369.json \
            /tmp/esito_H_near_miss_1368322369.json

      - name: Replay the final-row size sieve
        run: |
          python3 certificates/fibre_size/verifica_fibre_taglia.py \
            --k3-limit 100000 \
            --k5-limit 3000 \
            --expected certificates/fibre_size/VERIFICA_FIBRE_TAGLIA.json \
            --output /tmp/VERIFICA_FIBRE_TAGLIA.json

      - name: Replay the two-row transport census
        run: |
          python3 certificates/two_row_transport/verify_two_row_transport.py \
            --output /tmp/VERIFICA_TRASPORTO_DUE_RIGHE_1E6.json

      - name: Verify and merge the sharded q below 10M census
        run: |
          (cd certificates/triangle_k3_10m && sha256sum --check SHA256SUMS.txt)
          python3 certificates/triangle_k3_10m/replay_root/motore/unisci_censimenti_triangolo.py \
            certificates/triangle_k3_10m/fast_triangle_3_3m_final.json \
            certificates/triangle_k3_10m/fast_triangle_3m_5m.json \
            certificates/triangle_k3_10m/fast_triangle_5m_7p5m.json \
            certificates/triangle_k3_10m/fast_triangle_7p5m_10m.json \
            --output /tmp/TRIANGLE_K3_10M_MANIFEST.json
          cmp certificates/triangle_k3_10m/TRIANGLE_K3_10M_MANIFEST.json \
            /tmp/TRIANGLE_K3_10M_MANIFEST.json

      - name: Replay the quantized gap and odd shadow
        run: |
          python3 certificates/triangle_k3_10m/replay_root/motore/verifica_gap_quantizzato_k3.py \
            certificates/triangle_k3_10m/TRIANGLE_K3_10M_MANIFEST.json \
            --output /tmp/QUANTIZED_GAP_K3_10M.json
          cmp certificates/triangle_k3_10m/QUANTIZED_GAP_K3_10M.json \
            /tmp/QUANTIZED_GAP_K3_10M.json

      - name: Replay the portable H4-v3 audit package
        run: |
          python3 certificates/h4_assalto_finale/verify_h4_final_assault_v3.py \
            --root certificates/h4_assalto_finale \
            --output /tmp/VERIFICA_H4_ASSALTO_FINALE_v3.json

      - name: Recompute the complete census
        if: github.event_name == 'workflow_dispatch'
        run: python3 tools/verify_certificates.py --full

  comparator:
    name: Independent statement comparison
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out pinned Comparator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: leanprover/comparator
          ref: 1b82ba006811f7e25d53858252372e4d85fd3921
          path: .verification-tools/comparator

      - name: Check out pinned Landrun
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Zouuup/landrun
          ref: c91b41ac6cb180e2fdcb989408dcde34449bd8b0
          path: .verification-tools/landrun

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.24.0"
          cache: false

      - name: Build pinned Landrun
        working-directory: .verification-tools/landrun
        run: go build -o landrun cmd/landrun/main.go

      - name: Prepare the pinned Lean environment
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1
        with:
          build: true
          build-args: "--wfail"
          use-mathlib-cache: true

      - name: Build pinned Comparator and lean4export
        working-directory: .verification-tools/comparator
        run: lake build lean4export comparator

      - name: Compare all trusted statements with their solutions
        env:
          COMPARATOR_ROOT: ${{ github.workspace }}/.verification-tools/comparator
          COMPARATOR_LANDRUN: ${{ github.workspace }}/.verification-tools/landrun/landrun
        run: tools/run_comparator.sh
