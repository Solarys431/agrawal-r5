name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean:
    name: Lean kernel and certificates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the pinned Lean project
        uses: leanprover/lean-action@v1
        with:
          build: true
          build-args: "--wfail"
          use-mathlib-cache: true

      - name: Install certificate dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes pari-gp
          python3 -m pip install --requirement requirements.txt

      - name: Verify tracked release checksums
        run: sha256sum --check SHA256SUMS.txt

      - name: Replay shipped certificates
        run: python3 tools/verify_certificates.py

      - name: Independent scalar-completeness regression
        run: python3 tools/verify_scalar.py

      - name: Recompute the complete census
        if: github.event_name == 'workflow_dispatch'
        run: python3 tools/verify_certificates.py --full
