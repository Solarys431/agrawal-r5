# formalization.yaml (v0.3) — see https://github.com/mathlib-initiative/formalization.yaml
version: "v0.3"

project:
  name: "agrawal-r5"
  authors:
    - "UNICO/NOUS multi-model pipeline — mathematical development, paper, and formalization"
    - "Daniele Cappello — project initiation, pipeline operation, artifact curation, and accountability for provenance, stated scope, and public release"
  license: "Apache-2.0"

automation:
  - method: "LLM-assisted formalization"
    description: >-
      Statements and proofs written by an orchestrated multi-model pipeline
      using GPT-5.6-Sol (xhigh) in Codex and Claude Opus 4.8/5 in Claude Code
      under human operation and release curation, without claiming specialist
      mathematical verification by the human operator, with
      every declaration compiled by the Lean 4 kernel. The tracked
      AxiomAudit.lean runs #print axioms on 107 headline declarations
      in CI; ComparatorAxiomAudit.lean does the same for the seven declarations
      exported by the independent theorem surfaces. Both report only propext,
      Classical.choice, and Quot.sound. Pinned leanprover/comparator checks
      that each Mathlib-only Challenge statement is identical to its separate
      Solution statement before kernel replay. AssumptionAudit.lean inspects
      all 424 public theorems and 260 instance binders, with 58 current
      proof-route dependencies declared fail-closed; the complete 51-module
      upstream inventory is checked separately. No proof step is accepted on
      the strength of a model's assertion or agreement between models.
  - method: "numerical pre-verification"
    description: >-
      Each key identity was checked numerically on independent samples before
      being formalized (e.g. lcm(p−1,p+1,80) = 10(p²−1) on 304 primes ≡ 3 mod
      80 below 100000).

review:
  status: "model-based adversarial pre-review completed; human specialist review invited"
  details: >-
    Two independent model-based pre-publication reviews on 2026-07-26, both
    instructed to find faults rather than confirm. Both initially returned
    NOT READY. The substantive finding was that an earlier version of this
    file claimed as new an observation already present in the AIM proof; that
    claim was withdrawn and the release boundary repaired. No human
    specialist review is claimed; this public artifact explicitly invites it.

fidelity:
  divergences:
    - statement: "lenstra_proposition_card"
      source_hypothesis: "k ≡ 1 (mod 4) prime factors, all ≡ 3 (mod 80)"
      formalized_hypothesis: "identical"
      note: >-
        RESOLVED on 2026-07-26. An earlier version assumed the consequence
        n ≡ 3 (mod 80) instead of deriving it; the gap was found by adversarial
        review and closed the same day by mod_eighty_of_card, which proves the
        derivation for squarefree n via the product of the prime factors and
        3^4 ≡ 1 (mod 80). lenstra_proposition_card now assumes exactly what the
        source assumes. The weaker variant survives as lenstra_proposition.
    - statement: "lenstra_local and downstream"
      source_hypothesis: "p ≡ 3 (mod 80)"
      formalized_hypothesis: "p ≡ 3 (mod 80)"
      note: >-
        The chain covers only the class 3 mod 80. Separate lemmas in
        ClassMod80 treat the class 67 mod 80, but they are not wired into the
        main theorem.

sources:
  - title: "The moment obstruction"
    authors:
      - "this pipeline"
    id: "https://github.com/Solarys431/agrawal-r5"
    type: "finite Fourier lemma used by the local theory"
    license: "Apache-2.0"
    author_contacted: "n/a"
    prior_work: >-
      Formalized as `moment_covariance`, `moment_obstruction`, and
      `pow_succ_eq_one_of_moment_ne_zero`. For a function e on the units of a
      finite field satisfying e(ta)=t e(a), the weighted moment
      M_j=Σ a^j e(a) satisfies t M_j=t^(−j) M_j, hence
      (t^(j+1)−1)M_j=0. This is a short finite-Fourier/change-of-variables
      argument. We claim no priority for the abstract algebraic lemma. The
      potentially substantive object in the wider study is its application to
      the local set S(p,r). The complete general-r interface remains
      paper-level, while `LocalMomentBridge.lean` now formalizes the literal
      quotient-ring row, same-character covariance, and golden obstruction at
      r=5.

  - title: "The golden moment of Agrawal's congruence at r = 5"
    authors:
      - "this pipeline"
    id: "https://github.com/Solarys431/agrawal-r5"
    type: "new bridge derived in the course of this study"
    license: "Apache-2.0"
    author_contacted: "n/a"
    prior_work: >-
      The factorization was formalized on 2026-07-26 as
      `golden_moment_factorization`, `golden_moment_index`, and
      `zmod_golden_moment_index`.  On 2026-07-29 the exact product-to-sum
      interface was added as `quintic_index_indexedMomentUnit_eq_moment`,
      `indexedMomentUnit_two_eq_quadraticMomentUnit`, and
      `cyclotomic_quadratic_moment_eq_three_golden_index`; the same-character
      local seam was added as `localS5_unit_rows`,
      `localS5_quintic_covariance`, and the lift-free corollary
      `localS5_canonical_golden_moment_obstruction`; the direct simultaneous
      vanishing of the five and golden indices is
      `localS5_canonical_quintic_locks_of_ne_one`. If ζ satisfies
      Φ₅(ζ)=0, the weighted quadratic moment unit
      U₂=∏_{a=1}^4(ζ^a−1)^(a² mod 5) factors as (√5)^5 ε^3, where
      √5=1+2(ζ+ζ^4) and ε=1+ζ+ζ^4. Consequently every quintic index satisfies
      ind₅(U₂)=3 ind₅(ε), and the new interface proves that this index is
      literally the additive moment M₂ for the concrete family
      u_a=ζ^a−1.  No published index table or computer-algebra transcript is
      used as a premise.
      PRIOR ART BOUNDARY: Williams and Hardy, Acta Arith. 46 (1985), Theorem 5,
      compute the quintic index of ε in Dickson coordinates. That classical
      character is not ours. The potentially new contribution is identifying
      the Agrawal quadratic moment with it. We have not found that bridge in
      the targeted literature search; priority is explicitly provisional
      pending specialist review.

  - title: "The arithmetic H4 profile and its 2-adic saturation form"
    authors:
      - "this pipeline"
    id: "https://github.com/Solarys431/agrawal-r5"
    type: "exact formal reduction of the golden-inertia open problem"
    license: "Apache-2.0"
    author_contacted: "n/a"
    prior_work: >-
      Formalized as `goldenA`, `goldenH`,
      `dvd_goldenH_iff_scalar_profile`,
      `dvd_goldenH_order_factorization_two`, and
      `dvd_goldenH_nonsquare_iff_two_adic_saturation`. The separate module
      `LocalTransport.lean` defines the literal local row in
      (Z/p)[X]/Phi_5, derives the four labelled T5 rows, and proves
      `orderFourTransport_dvd_goldenH`; `ScalarCompleteness.lean` proves
      the converse existentially, including a constructive repair when the
      common cyclotomic defect is negative, and packages both directions as
      `hasOrderFourTransport_iff_goldenH_support`. For a prime p
      distinct from 2 and 5, divisibility by
      H_n=gcd(A_n,5^(n-1)+1) is equivalent to the two negative scalar
      semiperiods. Under that divisibility, inertia of 5 is equivalent to
      v_2(p-1)=v_2(n-1)+1. This is an exact reduction, not a proof of the
      universal golden-inertia conjecture. Both directions between existence
      of a residue-2 order-four transport in S(p,5) and support of H_n are now
      kernel-checked; the universal exclusion of split support remains open.
      We make no mathematical priority claim for the elementary order
      calculation.

  - title: "The Lenstra–Pomerance proposition on counterexamples to Agrawal's conjecture at r = 5"
    authors:
      - "Hendrik W. Lenstra, Jr."
      - "Carl Pomerance"
    id: "https://aimath.org/WWN/primesinp/articles/html/50a/"
    type: "proposition stated in research notes (American Institute of Mathematics, 2003, pp. 30–32)"
    license: "n/a (mathematical statement)"
    author_contacted: "no"
    prior_work: >-
      Independent formalization (2026-07-26) of the statement: if n is squarefree
      with n ≡ 3 (mod 80), every prime factor p ≡ 3 (mod 80), and both Korselt
      conditions hold ((p−1) | (n−1) and (p+1) | (n+1)), then the Agrawal
      congruence at r = 5 holds modulo n and n² ≢ 1 (mod 5). The proposition is
      quoted throughout the literature on the AKS test — OEIS A329223, the
      encyclopedic entry on the conjecture, Popovych (IACR ePrint 2009/008),
      Hegde–Devaraj (Springer 2021) — and, to our knowledge, had not been
      machine-checked in any proof assistant.
      What already exists: google-deepmind/formal-conjectures contains
      FormalConjectures/Wikipedia/Agrawal.lean with the STATEMENT of Agrawal's
      conjecture itself, tagged `@[category research open]` and closed by a
      `sorry`, as is proper for an open problem; the same file states Popovych's
      variant. Neither the Lenstra–Pomerance proposition nor any proof of it
      appears there. We claim no priority on the mathematics, which is Lenstra
      and Pomerance's, and none on the statement of the conjecture, which is
      already formalized in that repository.
      Route: OURS IS THE SAME ROUTE AS THE ORIGINAL. The AIM notes already
      contain, in the proof of the proposition, the identity
      (ζ₅−1)^(p²) = −ζ₅^(−1)(ζ₅−1), the consequence that the order of ζ₅−1
      divides 10(p²−1), and the reduction to n ≡ p (mod 10(p²−1)) verified on
      four coprime factors. Our presentation repackages that argument through
      the identity lcm(p−1, p+1, 80) = 10(p²−1); it is a different wrapping of
      the same proof, not an observation absent from the literature. An earlier
      draft of this file claimed otherwise; the claim was false and has been
      withdrawn. WE CLAIM NOTHING ON THE MATHEMATICS: the proposition and its
      proof are Lenstra and Pomerance's. We claim only the mechanical
      verification.

  - title: "The concrete split-witness-or-quartic-skeleton dichotomy"
    authors:
      - "this pipeline"
    id: "https://github.com/Solarys431/agrawal-r5"
    type: "formal interface theorem for the squarefree reduction"
    license: "Apache-2.0"
    author_contacted: "n/a"
    prior_work: >-
      Formalized as `LocalH4For`, `SplitOrderFourWitness`,
      `not_localH4For_iff_splitOrderFourWitness`,
      `localS5_orderFour_odd`,
      `quarticSkeleton_of_candidate_localH4`,
      `quarticSkeleton_card_odd`,
      `quarticSkeleton_card_ge_three`,
      `squarefree_counterexample_concrete_dichotomy`,
      `localS5_modEq_frobenius_power`,
      `localS5_modEq_frobenius_power_lcm`,
      `inertQuotient_residue_determined`,
      `quarticOrderRows_of_skeleton`,
      `determinedQuarticOrderRows_of_skeleton`,
      `quarticSkeleton_orderModulus_le_max`,
      `quarticSkeleton_orderModulus_le_gap`,
      `quarticSkeleton_factor_size_exclusion`,
      `squarefree_counterexample_order_dichotomy`,
      `squarefree_counterexample_witness_dichotomy`, and
      `no_squarefree_counterexample_of_no_witnesses`. The theorem states
      unconditionally that a squarefree candidate either has a local split
      order-four witness or has the full inert quartic skeleton, with odd
      prime-factor cardinality at least three. A later reduction from that
      concrete skeleton to a chosen global fiber witness is passed as the
      named premise `SkeletonToFiber`; it is not postulated as an axiom.
      Thus the kernel now checks the global-to-quartic arithmetic ingress and
      the exact residue-determined `1`-or-`p^2` row modulo
      `lcm(orderOf(zeta_5-1),5)` at every skeleton factor, while the
      concrete final-row size obstruction is also kernel-checked. The
      subsequent general-s finite-fiber encoding remains outside this release.

  - title: "Four-coefficient primitive support: kernel arithmetic interface"
    authors:
      - "this pipeline"
    id: "https://github.com/Solarys431/agrawal-r5"
    type: "formal arithmetic interface for an open golden-inertia reduction"
    license: "Apache-2.0"
    author_contacted: "n/a"
    prior_work: >-
      The kernel now defines the two remainder coefficients of
      Phi_m((5+sqrt(5))/2), checks both components of the split quadratic
      algebra, and proves `primitiveFourVanish_iff_dvd_D`.  From a good
      divisor of that intrinsic four-coefficient integer it derives the exact
      orders (4rs,2r,2s) in
      `dvd_primitiveFourCoefficientD_exact_order_profile`, then identifies
      the two scalar directions (5, epsilon^2) in
      `dvd_D_exact_scalar_profile`.  The combinatorial support lemma is
      completed by the universal theorem `no_split_single_odd_support`,
      excluding a split H-profile with p-1 = 8*q^e.  What remains outside
      Lean is sharply delimited: the paper's integral B_s construction and
      its exact-level bridge from the original gcd G_(r,s) to the intrinsic
      intersection, plus the Smith-normal-form multiplicity statement.
      Neither is represented by an axiom. The mathematical priority of the
      four-coefficient cyclotomic formulation is provisional pending
      specialist review.

  - title: "Korselt's criterion and Carmichael numbers"
    authors:
      - "Alwin Korselt (1899)"
      - "Robert Daniel Carmichael (1910)"
    id: "https://mathworld.wolfram.com/KorseltsCriterion.html"
    type: "classical theorem"
    license: "public domain"
    author_contacted: "n/a"
    prior_work: >-
      Introduced here (2026-07-26) because they were needed for the proposition
      above: `IsCarmichael`, `IsLucasCarmichael`, and Korselt's criterion in the
      form `IsCarmichael n → Nat.Coprime n b → Nat.FermatPsp n b`.
      What already exists: Mathlib has `Nat.FermatPsp`
      (Mathlib/NumberTheory/FermatPsp.lean) and the Carmichael FUNCTION λ
      (Mathlib/NumberTheory/ArithmeticFunction/Carmichael.lean), which is a
      different object; it has no Carmichael numbers and no Korselt criterion.
      google-deepmind/formal-conjectures defines `IsCarmichael` in its own
      support library (FormalConjecturesForMathlib/NumberTheory/Carmichael.lean).
      Ours is an independent definition with the Korselt implication proved; we
      claim no priority on the notion itself.

  - title: "The Agrawal congruence forces the base-5 Fermat congruence"
    authors:
      - "Hendrik W. Lenstra, Jr. (mathematical observation)"
      - "this pipeline (Lean formalization)"
    id: "https://aimath.org/WWN/primesinp/articles/html/38a/"
    type: "classical consequence, formally verified here in its squarefree r = 5 specialization"
    license: "n/a (mathematical statement); Apache-2.0 (formalization)"
    author_contacted: "no"
    prior_work: >-
      Lenstra's Remark 5 in the 2003 AIM problem notes records the more
      general implication r^n ≡ r (mod n). Our theorem proves the squarefree
      r = 5 specialization end-to-end in Lean: every squarefree n prime to 10
      satisfying the Agrawal congruence at r = 5 divides 5^(n−1) − 1. The
      argument evaluates the polynomial identity at the four fifth roots of
      unity and multiplies, using the explicit cofactor identity
      (z−1)(z²−1)(z³−1)(z⁴−1) = 5. We make no claim of novelty for the
      mathematics, only for its mechanical verification.

  - title: "Bounded order of ζ−1 in F_p[X]/Φ₅"
    authors:
      - "this pipeline"
    id: "https://github.com/Solarys431/agrawal-r5"
    type: "lemma derived in the course of this study"
    license: "Apache-2.0"
    author_contacted: "n/a"
    prior_work: >-
      NOT NEW. The bound for p ≡ 3 (mod 5) is stated explicitly in the AIM
      notes of Lenstra and Pomerance, inside the proof of the proposition
      above: "the order of (ζ₅−1) in F_p[ζ₅] divides 10(p²−1)". What is
      formalized here (2026-07-26) is that statement, in the division-free form
      (ζ−1)^(10p²) = (ζ−1)^10, together with the observation that the same
      proof covers BOTH inert classes p ≡ 2 and p ≡ 3 (mod 5), since
      2² ≡ 3² ≡ 4 (mod 5); the source treats only p ≡ 3. That extension to the
      second class is the only part we have not found stated, and it is a
      marginal remark, not a result. Popovych (IACR ePrint 2009/008) studies
      the subgroup generated by X−1 in the same quotient.

  - title: "Forced odd-prime partition under the two Korselt systems"
    authors:
      - "this pipeline (explicit corollary and Lean formalization)"
    id: "https://math.mit.edu/research/highschool/primes/materials/2016/Leng.pdf"
    type: "elementary structural corollary with prior mechanism in the literature"
    license: "Apache-2.0 (formalization)"
    author_contacted: "no"
    prior_work: >-
      The Lean theorem `partition_forced` states that if the Carmichael and
      Lucas–Carmichael Korselt divisibilities hold at two factors p and p' of
      the same n, and a prime q divides p−1 and p'+1, then q divides 2.
      Therefore no odd q occurs on both sides. Alec Leng's 2017 study already
      proves the underlying congruence n ≡ p (mod (p²−1)/2) and the stronger
      consequence that all prime factors of a simultaneous Carmichael and
      Lucas–Carmichael number are congruent modulo 12. The release claim is
      the explicit general odd-q extraction and its kernel proof, not absence
      of prior structure.

  - title: "Two-adic constraint on inert prime factors"
    authors:
      - "this pipeline"
    id: "https://github.com/Solarys431/agrawal-r5"
    type: "lemma derived in the course of this study"
    license: "Apache-2.0"
    author_contacted: "n/a"
    prior_work: >-
      Proved (2026-07-24): if the Agrawal congruence at r = 5 holds for a
      squarefree n prime to 5, then v₂(q−1) ≤ v₂(n−1) for every prime factor
      q ≡ ±2 (mod 5). Follows from the bridge together with Euler's criterion.
      No novelty claim on the mathematics.

notes: >-
  Nothing in this repository asserts or refutes Agrawal's conjecture. The
  proposition formalized here is a SUFFICIENT condition, not a necessary one:
  it says how to build a counterexample, not where all counterexamples must be.
  Note that primes satisfy its hypotheses trivially (n = 83 is a witness), and
  they are of course not counterexamples: only a COMPOSITE n produces one. Such
  an n would be simultaneously a Carmichael and a Lucas–Carmichael number; none
  is known, and the question has been open since Pomerance raised it in 1984 in
  connection with the Baillie–PSW primality test.
